name: Legacy Rollback - Deploy FastLink Admin to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_LEGACY_ROLLBACK to publish the legacy Pages fallback
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_LEGACY_ROLLBACK

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: inputs.confirmation == 'DEPLOY_LEGACY_ROLLBACK'
    runs-on: ubuntu-latest
    env:
      VITE_FASTLINK_API_URL: https://exquisite-surprise-production-309d.up.railway.app/api
      VITE_FASTLINK_ENVIRONMENT: PRODUCTION
      VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
