name: FastLink Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Sealed transport commit, never a UI rebuild identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref != 'refs/heads/codex/fl-b17-revenue-read-ci-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  admin-preview:
    name: Fixed sealed revenue Admin preview
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xw564477242-cmyk/fastlik-Admin' && github.ref == 'refs/heads/codex/fl-b17-revenue-read-ci-20261029' && github.run_attempt == 1 && github.sha == inputs.approved_commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-admin-dev
    concurrency:
      group: fl-b17-fixed-admin-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Only new sealed delivery guard tests
        run: node --test scripts/admin-revenue-read-ci.test.mjs
      - name: Install the historical pinned Wrangler without credentials or lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/fl-b17-wrangler" --no-save --ignore-scripts --no-audit --no-fund wrangler@4.114.0
      - name: Verify sealed input, bind metadata, publish exactly once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          HOSTED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          SEALED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_PUBLISHER_SHA: f7e572c84a4626085ef82f441487d16c42665f86f29c407fbf4252fb159eb5f5
          WRANGLER_BIN: ${{ runner.temp }}/fl-b17-wrangler/node_modules/.bin/wrangler
          PREVIEW_RESULT_FILE: ${{ runner.temp }}/fl-b17-revenue-preview-result.json
        run: node scripts/admin-revenue-read-ci.mjs
      - name: Only the non-secret release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-b17-revenue-preview-result-${{ github.sha }}
          path: ${{ runner.temp }}/fl-b17-revenue-preview-result.json
          if-no-files-found: warn
          retention-days: 7
