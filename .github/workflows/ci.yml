name: FastLink Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Sealed transport commit, never a UI rebuild identity
        required: true
        type: string
      operation:
        description: Explicit sealed operation
        required: true
        default: READ_ONLY
        type: choice
        options: [READ_ONLY, PUBLISH]

permissions:
  contents: read

jobs:
  build:
    if: github.ref != 'refs/heads/codex/fl-b17-revenue-read-ci-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  admin-preview:
    name: Fixed sealed revenue Admin preview
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xw564477242-cmyk/fastlik-Admin' && github.ref == 'refs/heads/codex/fl-b17-revenue-read-ci-20261029' && github.run_attempt == 1 && github.sha == inputs.approved_commit && inputs.operation == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-admin-dev
    concurrency:
      group: fl-b17-fixed-admin-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Only native version publication tests
        run: node --experimental-vm-modules --test scripts/admin-native-version-ci.test.mjs scripts/admin-startup-fix.test.mjs
      - name: Verify sealed input and native version upload then exact cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_B17_ADMIN_PREVIEW_API_TOKEN }}
          HOSTED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          SEALED_COMMIT: ${{ inputs.approved_commit }}
          NATIVE_VERSION_PUBLISH: 'true'
          APPROVED_NATIVE_PUBLISHER_SHA: ad6cf2fddc85a789feba57728f0d301b20268f840f59ffff5968276d5c80a6b0
          PREVIEW_RESULT_FILE: ${{ runner.temp }}/fl-b17-revenue-preview-result.json
        run: node scripts/admin-native-version-ci.mjs
      - name: Only the non-secret release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-b17-revenue-preview-result-${{ github.sha }}
          path: ${{ runner.temp }}/fl-b17-revenue-preview-result.json
          if-no-files-found: warn
          retention-days: 7

  admin-metadata-readonly:
    name: Fixed Admin metadata read only
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xw564477242-cmyk/fastlik-Admin' && github.ref == 'refs/heads/codex/fl-b17-revenue-read-ci-20261029' && github.run_attempt == 1 && github.sha == inputs.approved_commit && inputs.operation == 'READ_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-admin-dev
    concurrency:
      group: fl-b17-fixed-admin-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Only new read-only projection tests
        run: node --test scripts/admin-readonly-metadata-ci.test.mjs
      - name: Three fixed metadata GETs, no Wrangler or publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_B17_ADMIN_PREVIEW_API_TOKEN }}
          HOSTED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          SEALED_COMMIT: ${{ inputs.approved_commit }}
          READONLY_METADATA_ONLY: 'true'
          APPROVED_READER_SHA: 3180a7d9973ff7c70c294a6b9ee2c8667476ba35d8ec0cc872e9d0e48faf2a79
          READONLY_RESULT_FILE: ${{ runner.temp }}/fl-b17-admin-metadata-readonly.json
        run: node scripts/admin-readonly-metadata-ci.mjs
      - name: Only safe metadata projection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-b17-admin-metadata-readonly-${{ github.sha }}
          path: ${{ runner.temp }}/fl-b17-admin-metadata-readonly.json
          if-no-files-found: warn
          retention-days: 7
